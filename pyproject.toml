[project]
name = "monstervale-ia"
version = "0.1.0"
description = "Rede neural (PPO) para dominar o tower defense Monstervale"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "gymnasium>=1.0",
    "numpy>=2.0",
    "tensorboard>=2.18",
    "torch>=2.8",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

# PyTorch: no Linux, o pacote do PyPI já vem com CUDA. No Windows, o do PyPI é
# só CPU; a build com CUDA 13.2 vem do repositório do próprio PyTorch.
[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu132", marker = "sys_platform == 'win32'" }]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["monstervale_ia"]

[tool.pytest.ini_options]
testpaths = ["testes"]
markers = ["lento: paridade de partidas inteiras (minutos); pule com -m 'not lento'"]
