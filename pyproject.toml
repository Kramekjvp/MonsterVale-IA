[project]
name = "monstervale-ia"
version = "0.1.0"
description = "Rede neural (PPO) para dominar o tower defense Monstervale"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["monstervale_ia"]

[tool.pytest.ini_options]
testpaths = ["testes"]
